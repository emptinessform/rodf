[workspace]
resolver = "3"
members = [
    "crates/rodf-core",
    "crates/rodf-render",
    "crates/rodf-cli",
]
exclude = ["spike-m0"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rodf-core = { path = "crates/rodf-core" }
rodf-render = { path = "crates/rodf-render" }
zip = { version = "8.1", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
thiserror = "2"
# rdocx 레이아웃 엔진 (경로 α 어댑터가 사용).
# "font-natural" line rule(4ab9020) + synthetic italic(38f2aa8)이 필요해 포크에 rev 고정.
# 로컬에서 포크를 고치며 작업할 때는 임시로 path 의존으로 바꿔 쓸 것:
#   { path = "../SBDoc/rdocx-fork/crates/<crate>" }
rdocx-layout = { git = "https://github.com/emptinessform/rdocx", rev = "38f2aa87a16fa189629119f389a266ae35f3d6fa" }
rdocx-oxml = { git = "https://github.com/emptinessform/rdocx", rev = "38f2aa87a16fa189629119f389a266ae35f3d6fa" }
oxml-layout = { git = "https://github.com/emptinessform/rdocx", rev = "38f2aa87a16fa189629119f389a266ae35f3d6fa" }
oxml-pdf = { git = "https://github.com/emptinessform/rdocx", rev = "38f2aa87a16fa189629119f389a266ae35f3d6fa" }
oxml-drawing = { git = "https://github.com/emptinessform/rdocx", rev = "38f2aa87a16fa189629119f389a266ae35f3d6fa" }

