name: Oracle (deterministic)

# 결정론 오라클: 고정 LO/폰트/래스터라이저 컨테이너에서 noto 코퍼스 스코어보드.
# 수동 실행 + 주간 회귀. (푸시마다 돌리기엔 무겁고, 로컬 오라클이 1차 게이트)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0" # 매주 월요일 06:00 KST

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build oracle image
        run: docker build -t rodf-oracle -f oracle/Dockerfile .
      - name: Run scoreboard
        run: docker run --rm -v "$PWD:/work" rodf-oracle
      - name: Show scoreboard
        run: cat docs/scoreboard-ci.md
      - uses: actions/upload-artifact@v4
        with:
          name: scoreboard-ci
          path: |
            docs/scoreboard-ci.md
            docs/scoreboard-ci.json
